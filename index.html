<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow - Your Reliable Weather Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-sun"></i> WeatherNow</h1>
            <p>Accurate weather forecasts at your fingertips! ✨</p>
        </header>
        
        <main>
            <div class="search-container">
                <form id="weather-form">
                    <input type="text" id="city-input" placeholder="Enter your city..." required>
                    <button type="submit"><i class="fas fa-search"></i> Get Weather</button>
                </form>
            </div>
            
            <div id="loading-section" class="hidden">
                <div class="loading-spinner"></div>
                <div id="loading-message">Connecting to weather satellites...</div>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
            
            <div id="weather-result" class="hidden">
                <h2 id="prank-message"></h2>
                <img id="prank-image" alt="Weather Prank">
                <button id="try-again"><i class="fas fa-redo"></i> Try Another City</button>
            </div>
        </main>
        
        <footer>
            <p>WeatherNow &copy; 2025 | The most "accurate" weather service 😉</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
